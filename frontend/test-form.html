<!DOCTYPE html>
<html>
<body>
  <h2>Create Order</h2>
  <form id="orderForm">
    <input type="text" id="product" placeholder="Product" required><br>
    <input type="number" id="quantity" placeholder="Quantity" required><br>
    <input type="text" id="customer" placeholder="Customer" required><br>
    <input type="number" step="0.01" id="totalPrice" placeholder="Price" required><br>
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const order = {
        product: document.getElementById('product').value,
        quantity: parseInt(document.getElementById('quantity').value),
        customer: document.getElementById('customer').value,
        totalPrice: parseFloat(document.getElementById('totalPrice').value)
      };

      const response = await fetch('http://localhost:3000/api/save-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(order)
      });

      const result = await response.json();
      alert(result.message);
    });
  </script>
</body>
</html>
